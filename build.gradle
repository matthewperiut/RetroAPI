import java.time.Duration

plugins {
	id 'java'
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom-remap' version '1.17.13'
	id 'ploceus' version '1.17.4'
	// Emits retroapi-<version>-babric.jar: reverse-converted to babric and bundled with OSL + joptsimple.
	id 'com.periut.retroconvert' version '1.0.0'
}

base {
	archivesName = project.archives_base_name
}
version = project.version
group = project.maven_group

ploceus {
	setIntermediaryGeneration(2)
}

repositories {
	maven { url = "https://matthewperiut.github.io/repository" }
	maven { name = 'Glass Releases'; url = "https://maven.glass-launcher.net/releases" }
	maven { name = 'Glass Snapshots'; url = "https://maven.glass-launcher.net/snapshots" }
	maven { name = 'Glass Babric'; url = "https://maven.glass-launcher.net/babric" }
	exclusiveContent {
		forRepository {
			maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
	maven { name = 'Jitpack'; url = 'https://jitpack.io' }
	maven { name = 'Ornithe Releases'; url = 'https://maven.ornithemc.net/releases' } // gen2 OSL for the babric bundle
	// Loom >= 1.17 claims the whole org.lwjgl group for Mojang's libraries repo, which mirrors LWJGL
	// 3.4.0 only for the platforms Minecraft itself ships. retrodragon also wants
	// natives-linux-arm64, which only exists on Central, so claim the group for Central too.
	exclusiveContent {
		forRepository { mavenCentral() }
		filter { includeGroup('org.lwjgl') }
	}
	mavenCentral()
	mavenLocal()
}

// No retroconvert `bundle` list any more. The OSL modules it used to name are `include`d in the
// dependencies block below, so BOTH jars carry them from one list: the babric conversion recurses
// into this jar's nested jars and reverse-converts each one, exactly as it already does for the
// StationAPI compat module. Naming them in both places would nest them twice.
//
// There is no `bundle` list at all now, and joptsimple does not need one: the bundler adds it to the
// babric jar itself as a fixed runtime dependency. Naming it here as well produced two copies of it
// under META-INF/jars.

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// ORDER MATTERS, and only since ploceus 1.17. These six have to come BEFORE the mappings
	// dependency: ploceus resolves them when ploceus.mappings(...) is evaluated, so declared after it
	// they are still empty and the game jar is remapped with NO inner classes, silently. Everything that
	// should be nested gets flattened into net/minecraft/unmapped/, which splits packages that must stay
	// whole, and beta's bundled argo library then throws IllegalAccessError in Minecraft.init on any
	// launch where a stats file exists.
	clientExceptions ploceus.raven(project.client_raven_build, 'client')
	serverExceptions ploceus.raven(project.server_raven_build, 'server')
	clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
	serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
	clientNests "net.glasslauncher:biny-nests:b1.7.3-client+build.${project.client_nests_build}"
	serverNests "net.glasslauncher:biny-nests:b1.7.3-server+build.${project.server_nests_build}"

	mappings ploceus.mappings("net.glasslauncher:biny-ornithe:b1.7.3+build.${project.biny_mappings}:mergedv2")

	ploceus.dependOsl(project.osl_version)

	// The five OSL gen2 modules RetroAPI's fabric.mod.json requires, bundled into the jar itself.
	// OSL ships with the Ornithe launcher profile, so on a normal install these are redundant - but
	// "normal install" is not the only way anyone gets here, and a missing dependency is a refusal to
	// load rather than a degraded feature. The babric jar has always carried them; this is the same
	// set, for the other toolchain.
	//
	// Declared here rather than in the retroconvert block below, so both jars get them from one list:
	// the babric conversion recurses into this jar's nested jars and reverse-converts what it finds,
	// which is how the StationAPI compat module already reaches babric users.
	include "net.ornithemc.osl-gen2:core:0.7.1"
	include "net.ornithemc.osl-gen2:entrypoints:0.6.0+mca1.0.1_01-mc1.5.2"
	include "net.ornithemc.osl-gen2:lifecycle-events:0.6.0+mcb1.3-mcb1.7.3"
	include "net.ornithemc.osl-gen2:networking:0.9.0+mcb1.0-mc13w39b"
	include "net.ornithemc.osl-gen2:networking-impl:0.1.1+mcb1.5-mc11w48a"

	// Babric does not ship joptsimple and the dedicated server needs it. It used to arrive as the
	// bundler's own runtime dependency, which it only adds when there is a `bundle` list to process -
	// so removing that list silently took it away. Here instead, from the same one list: an extra copy
	// in the Ornithe jar, whose profile already provides it, is a few tens of kilobytes against a
	// server that will not start.
	include "net.sf.jopt-simple:jopt-simple:5.0.4"

	include "io.netty:netty-buffer:4.1.77.Final"
	include "io.netty:netty-common:4.1.77.Final"

	// When built with -Pstationapi, JiJ the StationAPI compat mod into the distribution. Its fabric.mod.json
	// depends on both retroapi + stationapi, so Fabric loads the nested mod ONLY when a player also has
	// StationAPI installed - a single retroapi jar that "just works" with or without StationAPI, no second
	// download. This nesting flows through to the -babric bundle too: the babricJar reverse-conversion
	// recurses into the umbrella's nested jars, so the compat is reverse-converted to babric automatically
	// (hence NO separate retroconvert `bundle` entry for it - that would nest it twice).
	if (providers.gradleProperty('stationapi').isPresent()) {
		include project(':stationapi')
	}

	// NOTE: RetroAPI core has NO StationAPI dependency. The optional StationAPI integration lives entirely
	// in the separate :stationapi module (the retroapi-stationapi mod), so a fresh clone can build, run the
	// test mod, and develop core without ever downloading StationAPI. See settings.gradle (-Pstationapi).
	// retrodragon brings LWJGL 3, which would clash with vanilla Minecraft's LWJGL 2 API, so keep it
	// off the compile classpath. It replaces starac, which used to sit here: starac's MinecraftMixin
	// redirects a `noCanvas` target that does not exist on Fabric's applet launch path, and a redirect
	// that finds no target is a HARD mixin failure, so any consumer whose environment launches through
	// the applet entrypoint (macOS does) crashed before drawing a frame on
	//   Critical injection failure: Redirector noCanvas(...) failed injection check, (0/1) succeeded
	// and could not do anything about it, because this dependency reaches consumers transitively.
	modRuntimeOnly "com.periut:retrodragon:${project.retrodragon_version}"
}

// Exclude the Legacy Fabric LWJGL 2 wrapper at RUNTIME only (retrodragon provides LWJGL 3).
// It must stay on the compile/minecraft classpath so Condor (Ploceus LVT generator)
// can resolve org.lwjgl.* classes referenced by b1.7.3 - a blanket exclude here
// strips LWJGL 2 from minecraftCompileLibraries and crashes LVT generation.
configurations.matching { it.name.toLowerCase().contains('runtime') }.configureEach {
	exclude group: 'org.lwjgl.lwjgl'
}

// ---------------------------------------------------------------------------------------------
// StationAPI compile stubs (src/stapiStub)
//
// The tweaks half of the mod reaches StationAPI through two entrypoint keys a loader without
// StationAPI never asks for, so those classes need a handful of StationAPI/UnsafeEvents signatures
// to COMPILE and nothing at runtime. They cannot live in the :stationapi module: that module only
// exists under -Pstationapi, and these have to work in the default jar as well.
//
// A separate source set precisely so they cannot leak: the output goes on main's COMPILE classpath
// and nowhere else - not the runtime classpath, not the jar, where a stub would shadow the real
// StationAPI and break every mod that depends on it.
sourceSets {
	stapiStub
}

// Order matters: the stubs need Minecraft's own types, so they take main's compile classpath as it
// stands BEFORE the stub output is added to it. The other order is a cycle.
sourceSets.stapiStub.compileClasspath += sourceSets.main.compileClasspath
sourceSets.main.compileClasspath += sourceSets.stapiStub.output
tasks.named('compileJava') { dependsOn tasks.named('stapiStubClasses') }

def verifyNoStubsInJar = tasks.register('verifyNoStubsInJar') {
	dependsOn tasks.named('jar')
	def jarFile = tasks.named('jar').flatMap { it.archiveFile }
	doLast {
		def leaked = zipTree(jarFile.get().asFile).matching {
			include 'net/modificationstation/**'
			include 'net/mine_diver/**'
		}.files
		if (!leaked.isEmpty()) {
			throw new GradleException("StationAPI compile stubs leaked into the jar: ${leaked}")
		}
	}
}
tasks.named('check') { dependsOn verifyNoStubsInJar }

// Don't fail test task when no tests are discovered (these are mod test classes, not unit tests)
tasks.withType(Test) {
	failOnNoDiscoveredTests = false
}

// The commands API's offline suite: plain Java with a `main` rather than JUnit, because b1.7.3
// development is frequently offline and a test framework would be one more artifact to resolve
// before anything can be checked. Nothing in it may touch a Minecraft class that needs a running game.
sourceSets {
	test {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

def commandsTest = tasks.register('commandsTest', JavaExec) {
	group = 'verification'
	description = 'Offline commands-API suite: brigadier, text components, argument parsing, tree sync.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.periut.retroapi.commands.test.TestRunner'
}
tasks.named('check') { dependsOn commandsTest }

loom {
	accessWidenerPath = file("src/main/resources/retroapi.accesswidener")
	mods {
		"retroapi" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		mavenLocal()
	}
}

tasks.register('buildLibs') {
	dependsOn ':remapJar'
	group = 'build'
	description = 'Build the retroapi distribution JAR'
}

// ---------------------------------------------------------------------------------------------------
// Headless vanilla <-> StationAPI world-conversion round-trip test (the self-contained "unit test").
//
//   ./gradlew conversionRoundTripTest
//
// Pipeline (each step is its own JVM that runs to completion and exits):
//   1. :test:runPopulateServer       - non-StationAPI server places deterministic modded content
//                                       (extended blocks w/ metadata, a chest of modded + component
//                                       items, dropped item entities, a modded mob), self-verifies it
//                                       in-engine, writes a manifest, saves a McRegion + sidecar world.
//   2. convCopyWorld                 - copies that world into the StationAPI client's saves.
//   3. :test:stapi:runRoundtripClient - StationAPI client forward-converts to flattened, asserts content
//                                       survived on disk, reverse-converts back to McRegion, asserts
//                                       again, writes a PASS/FAIL result file and exits.
//   4. convGate                      - fails the build unless the result file says the round-trip passed.
//
// NOTE: step 3 launches the GUI client (it hosts StationAPI's client-only conversion storage source),
// so it needs a display. Modded-dimension content is reported as a known limitation.
// ---------------------------------------------------------------------------------------------------
// The round-trip needs the StationAPI client (:test:stapi), so it only exists when StationAPI is enabled
// (-Pstationapi). Without that flag :test:stapi isn't part of the build and this block is skipped.
if (providers.gradleProperty('stationapi').isPresent()) {
	def convWorldSrc = 'test/run/world'
	def convWorldDst = 'test/stapi/run/saves/convtest'

	tasks.register('convCleanWorlds', Delete) {
		delete convWorldSrc, convWorldDst
	}

	tasks.register('convCopyWorld', Copy) {
		from convWorldSrc
		into convWorldDst
		// Drop the populate-stage result lines so the gate reads only this round-trip's verdict.
		exclude 'retroapi_test_result.txt'
	}

	// The populate stage writes its own PASS/FAIL, and convCopyWorld deliberately drops that file so the
	// round-trip gate reads only the round-trip's verdict - which meant a FAILING populate stage sailed
	// through silently. Gate it where it is written, before the copy.
	tasks.register('convPopulateGate') {
		doLast {
			def f = file("${convWorldSrc}/retroapi_test_result.txt")
			if (!f.exists()) {
				throw new GradleException('populate stage wrote no result file - the server did not finish.')
			}
			def text = f.text
			logger.lifecycle("\n===== populate report =====\n${text}===========================")
			if (!text.contains('populate: PASS')) {
				throw new GradleException('populate stage FAILED - see the report above.')
			}
		}
	}

	// Step 4: take the world the client just reverse-converted BACK to McRegion + sidecar, and load it on a
	// plain (non-StationAPI) dedicated server. Disk verification proves the bytes survived; this proves the
	// content is runtime-valid in plain RetroAPI, which is the actual claim - that a converted world is
	// genuinely usable, not merely intact. The `verify` scenario has always existed and been documented as
	// this step, and was wired into nothing.
	tasks.register('convCopyBackWorld', Copy) {
		from convWorldDst
		into convWorldSrc
		// Keep the populate verdict already in the destination; verify appends its own line.
		exclude 'retroapi_test_result.txt'
	}

	tasks.register('convVerifyGate') {
		doLast {
			def f = file("${convWorldSrc}/retroapi_test_result.txt")
			if (!f.exists()) {
				throw new GradleException('verify stage wrote no result file - the server did not finish.')
			}
			def text = f.text
			logger.lifecycle("\n===== verify (mcregion) report =====\n${text}====================================")
			if (!text.contains('verify(mcregion): PASS')) {
				throw new GradleException('reverse-converted world is NOT runtime-valid in plain RetroAPI - see above.')
			}
		}
	}

	tasks.register('convGate') {
		doLast {
			def f = file("${convWorldDst}/retroapi_test_result.txt")
			if (!f.exists()) {
				throw new GradleException('conversion round-trip produced no result file - the client did not complete.')
			}
			def text = f.text
			logger.lifecycle("\n===== conversion round-trip report =====\n${text}=========================================")
			if (text.contains('roundtrip: FAIL') || !text.contains('roundtrip: PASS')) {
				throw new GradleException('conversion round-trip FAILED - see the report above.')
			}
			logger.lifecycle('conversion round-trip PASSED (overworld content retained both directions).')
		}
	}

	tasks.register('conversionRoundTripTest') {
		group = 'verification'
		description = 'Headless vanilla<->StationAPI world conversion round-trip; fails on any modded-data loss.'
		dependsOn 'convCleanWorlds', ':test:runPopulateServer', 'convPopulateGate', 'convCopyWorld',
			':test:stapi:runRoundtripClient', 'convGate',
			'convCopyBackWorld', ':test:runVerifyServer', 'convVerifyGate'
	}

	gradle.projectsEvaluated {
		def populate = project(':test').tasks.getByName('runPopulateServer')
		def roundtrip = project(':test:stapi').tasks.getByName('runRoundtripClient')
		populate.mustRunAfter(tasks.named('convCleanWorlds'))
		tasks.named('convPopulateGate').configure { mustRunAfter populate }
		tasks.named('convCopyWorld').configure { mustRunAfter tasks.named('convPopulateGate') }
		roundtrip.mustRunAfter(tasks.named('convCopyWorld'))
		tasks.named('convGate').configure { mustRunAfter roundtrip }

		def verify = project(':test').tasks.getByName('runVerifyServer')
		tasks.named('convCopyBackWorld').configure { mustRunAfter tasks.named('convGate') }
		verify.mustRunAfter(tasks.named('convCopyBackWorld'))
		tasks.named('convVerifyGate').configure { mustRunAfter verify }
	}
}

// ---------------------------------------------------------------------------------------------------
// Launch smoke tests - the "does the game still start" suite.
//
//   ./gradlew smokeTest                  client + server
//   ./gradlew smokeTest -Pstationapi     the above, plus both sides with StationAPI installed
//   ./gradlew clientSmokeTest            just the client
//
// Each one boots the game with -Dretroapi.test.scenario=smoke, force-loads every class RetroAPI mixes
// into (so every mixin is applied and every injector runs), asserts the client hooks are actually
// present, writes a verdict file and exits.
//
// This is the suite that catches mapping drift. A @Shadow naming a field that no longer exists, an
// @At whose instruction moved, an injector with the wrong callback signature: all compile fine, and
// all crash the game the moment it loads that one class - which for a render-side mixin can be long
// after startup, so "it launched" proves nothing. The conversion round-trip cannot see any of it: it
// tests world data, not class loading. Sweeping every target in one boot does.
// ---------------------------------------------------------------------------------------------------
def smokeRuns = [
	client: [':test', 'runSmokeClient', 'test/run', 'client'],
	server: [':test', 'runSmokeServer', 'test/run', 'server'],
]
if (providers.gradleProperty('stationapi').isPresent()) {
	smokeRuns.stapiClient = [':test:stapi', 'runSmokeClient', 'test/stapi/run', 'client']
	smokeRuns.stapiServer = [':test:stapi', 'runSmokeServer', 'test/stapi/run', 'server']
}

smokeRuns.each { key, cfg ->
	def (projectPath, runTaskName, runDir, side) = cfg
	def cap = key.capitalize()
	def resultPath = "${runDir}/retroapi_smoke_${side}.txt"

	tasks.register("smoke${cap}Clean", Delete) {
		// The stats folder goes too: b1.7.3's bundled argo parser is package-private, and once a stats
		// file exists the next launch reads it and dies with IllegalAccessError on argo.jdom before it
		// reaches the check. A smoke run that can only be run once is not a smoke test.
		delete resultPath, "${runDir}/stats"
	}

	tasks.register("smoke${cap}Gate") {
		doLast {
			def f = file(resultPath)
			if (!f.exists()) {
				throw new GradleException("${key} smoke test wrote no result file - the game never reached "
					+ "the check. It almost certainly crashed during startup; see the log above.")
			}
			def text = f.text
			logger.lifecycle("\n===== ${key} smoke report =====\n${text}===============================")
			if (!text.contains("smoke(${side}): PASS")) {
				throw new GradleException("${key} smoke test FAILED - see the report above.")
			}
			logger.lifecycle("${key} smoke test PASSED.")
		}
	}

	tasks.register("${key}SmokeTest") {
		group = 'verification'
		description = "Boot the ${key} game, apply every RetroAPI mixin, assert the hooks are live."
		dependsOn "smoke${cap}Clean", "${projectPath}:${runTaskName}", "smoke${cap}Gate"
	}
}

tasks.register('smokeTest') {
	group = 'verification'
	description = 'Run every launch smoke test (client + server, and both with StationAPI under -Pstationapi).'
	dependsOn smokeRuns.keySet().collect { "${it}SmokeTest" }
}

gradle.projectsEvaluated {
	smokeRuns.each { key, cfg ->
		def (projectPath, runTaskName, runDir, side) = cfg
		def cap = key.capitalize()
		def run = project(projectPath).tasks.getByName(runTaskName)
		run.mustRunAfter(tasks.named("smoke${cap}Clean"))
		// Let the gate deliver the verdict, not the exit code: a failing smoke run exits non-zero, and
		// stopping there would skip the report that says WHICH mixin broke. A crash before the check
		// still fails the build - the gate finds no result file.
		if (run instanceof JavaExec) {
			run.ignoreExitValue = true
		}
		// A run that dies does not necessarily exit: a client exception lands on the AWT thread and the
		// window stays up, a crashed server can sit in its shutdown hook. Cap it - the gate then reports
		// a missing result file, which is the truth. Ninety seconds because a passing run takes about
		// five; the old five-minute cap meant every failure cost five minutes before saying so.
		run.timeout = Duration.ofSeconds(90)
		tasks.named("smoke${cap}Gate").configure { mustRunAfter run }
	}
	// One launcher at a time: two dev clients sharing a run directory (and a display) is a coin flip.
	def order = smokeRuns.collect { key, cfg -> project(cfg[0]).tasks.getByName(cfg[1]) }
	for (int i = 1; i < order.size(); i++) {
		order[i].mustRunAfter(order[i - 1])
	}
}

allprojects {
	tasks.withType(GenerateModuleMetadata) {
		enabled = false
	}
}
